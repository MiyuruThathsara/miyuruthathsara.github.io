<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }} | {% if page.url == '/' %}Personal Profile{% else %}{{ site.title | escape }}{% endif %}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fcfbf8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#151c22" media="(prefers-color-scheme: dark)">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | default: site.title | escape }} | {% if page.url == '/' %}Personal Profile{% else %}{{ site.title | escape }}{% endif %}">
    <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/me.jpeg' | absolute_url }}">
    <meta property="og:image:alt" content="Miyuru Thathsara">
    <meta name="twitter:card" content="summary">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <script src="{{ '/assets/js/theme.js' | relative_url }}?v=20260915-touch"></script>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/tools.css' | relative_url }}">
    <script src="{{ '/assets/js/images.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/navigation.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/cv.js' | relative_url }}" type="module"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": {{ site.title | jsonify }},
        "url": {{ '/' | absolute_url | jsonify }},
        "image": {{ '/me.jpeg' | absolute_url | jsonify }},
        "jobTitle": "Ph.D. Candidate",
        "affiliation": {
          "@type": "Organization",
          "name": "Nanyang Technological University"
        },
        "sameAs": [
          {{ site.personal_website | jsonify }},
          {{ site.github_url | jsonify }},
          {{ site.linkedin_url | jsonify }},
          {{ site.scholar_url | jsonify }}
        ]
      }
    </script>
  </head>
  <body id="top">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="Miyuru Thathsara, home"><span class="brand-initials" aria-hidden="true">MT</span><span>Personal Profile</span></a>
        <nav aria-label="Main navigation">
          {% for item in site.data.navigation %}<a href="{{ item.url | relative_url }}" data-section="{{ item.section }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}
        </nav>
        <div class="header-actions">
          {% include cv-button.html %}
          {% include theme-control.html %}
        </div>
      </div>
    </header>
    <main class="page-shell" id="main-content" tabindex="-1">
      {{ content }}
    </main>
    {% include profile-tools.html %}
    <footer class="site-footer">
      <div class="footer-inner">
        <p>© {{ 'now' | date: '%Y' }} Miyuru Thathsara</p>
        <a href="{{ site.personal_website }}">miyuruthathsara.com <span aria-hidden="true">↗</span></a>
        <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
      </div>
    </footer>
  </body>
</html>
