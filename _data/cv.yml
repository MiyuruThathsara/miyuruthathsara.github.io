# CV-specific wording; shared entries live in profile.json/publications.json and contacts in _config.yml.
company_summary: Final-year PhD candidate in Computer Science at Nanyang Technological University, Singapore, with research and industry experience in embedded intelligence and hardware acceleration. Combines algorithm development, hardware design, and system integration to build efficient computing solutions for autonomous robotics and low-latency data processing.
# Company-only editing preserves the full source descriptions on the site and academic CV.
company_roles:
  Project Officer (Research):
    - Co-designed visual SLAM algorithms and custom hardware acceleration on the Kria KV260 FPGA SoC.
  Engineering Consultant:
    - Contributed FPGA virtualization and network-attached acceleration to the Cloud Native Logic platform.
  Engineer, Accelerated Systems:
    - In LSEG's HWAC team, built a multi-channel AXI DMA engine for the GTP product; contributed Linux driver integration and FPGA partial reconfiguration.
  ntu:Research Assistant:
    - Developed a systolic-array SONN classifier; explored pruning, quantization and Posits for inference.
  moratuwa:Research Assistant:
    - Contributed a hexacopter flight controller to an MPhil UAV research project.
company_publications:
  fpl2025: Integrated stereo visual SLAM on an FPGA SoC with low-latency feature matching and tracking-driven keyframes; evaluated on benchmarks and real-world sequences.
  fpt2024: Designed a streaming FPGA architecture for spatially uniform keypoint selection with variable input sizes and efficient resource use.
  iscas2024: Accelerated feature matching by approximately 12× over linear exhaustive search on FPGA using a balanced binary search tree.
  fpl2020: Designed a lifelong deep-learning FPGA architecture using computation scheduling and hardware reuse; evaluated on CORe50.
academic_summary: Final-year PhD candidate in Computer Science at Nanyang Technological University, Singapore, working at the intersection of computer vision, robotics, and computer architecture. Studies the joint design of algorithms and computing systems to support practical, energy-efficient autonomy.
research_focus: Current research addresses efficient onboard visual perception, localization, and mapping for autonomous robots. The approach combines algorithm design and hardware acceleration to operate within tight computing and energy budgets. The longer-term goal is collaborative autonomy, enabling teams of robots to share spatial knowledge and coordinate their actions.
publications:
  fpl2025: FPGA-SoC implementation of stereo visual SLAM with region-aware descriptor grouping for low-latency feature matching and tracking-driven keyframe generation. Evaluated on benchmark sequences and in real-world experiments.
  fpt2024: Streaming FPGA architecture for spatially uniform keypoint selection, combining grid-based processing with efficient neighbour sorting to accommodate variable input sizes and improve resource efficiency.
  iscas2024: Stream-processing FPGA architecture for feature matching using a balanced binary search tree and ratio-test outlier rejection. Achieves approximately 12× faster matching than linear exhaustive search on FPGA.
  fpl2020: FPGA architecture for lifelong deep learning on resource-constrained edge devices, using computation scheduling and hardware reuse. Evaluated on the CORe50 benchmark.
  iciafs2018: Acknowledged contribution to prototype development and flight-stabilization validation for a modular multi-quadrotor UAV, investigating controller reuse and replaceable quadrotor units.
